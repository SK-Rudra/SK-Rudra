name: snake

# Turns the contribution graph into a snake game, colored with the
# banner palette (night -> aurora dots, moonlight snake), and publishes
# the SVGs to the `output` branch that README.md points at.

on:
  schedule:
    - cron: "0 0 * * *" # daily, 06:00 Dhaka time
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#eef2cf&color_dots=#161f45,#1e4a4c,#2b7a64,#43a77f,#5ccf96
            dist/snake-light.svg?color_snake=#262a5c&color_dots=#e6e9f2,#bfe6d2,#86cfaa,#4cad82,#2f8f6a

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
